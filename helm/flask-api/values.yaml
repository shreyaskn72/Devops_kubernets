replicaCount: 2

image:
  repository: ghcr.io/shreyaskn72/hello-world-flask-kubernets
  tag: master-0781209
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: flask-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Database Configuration
# For the VS Code devcontainer: Set enabled to false
# MySQL runs as a Docker container outside the kind cluster.
# For Option 2 (Local MySQL): Set enabled to false
# MySQL will NOT be deployed by Helm - use local Docker MySQL instead
mysql:
  enabled: false
  auth:
    rootPassword: rootpassword
    database: flask_app
    username: flask_user
    password: flask_password
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Environment variables for Flask app
# References K8s ConfigMap 'app-config' and Secret 'app-secret' created from .env files (local dev)
# or from Doppler (production)
env:
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: app-config
        key: DB_HOST
  - name: DB_PORT
    valueFrom:
      configMapKeyRef:
        name: app-config
        key: DB_PORT
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: DB_USER
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: DB_PASSWORD
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: app-config
        key: DB_NAME
  - name: CELERY_BROKER_URL
    valueFrom:
      configMapKeyRef:
        name: app-config
        key: CELERY_BROKER_URL
  - name: CELERY_RESULT_BACKEND
    valueFrom:
      configMapKeyRef:
        name: app-config
        key: CELERY_RESULT_BACKEND

resources: {}