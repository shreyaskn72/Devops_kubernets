replicaCount: 2

image:
  repository: ghcr.io/shreyaskn72/hello-world-flask-kubernets
  tag: master-e47e670
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: flask-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Database Configuration
# For Option 2 (Local MySQL): Set enabled to false
# MySQL will NOT be deployed by Helm - use local Docker MySQL instead
mysql:
  enabled: false
  auth:
    rootPassword: rootpassword
    database: flask_app
    username: flask_user
    password: flask_password
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Environment variables for Flask app
# Option 2: Local MySQL running on Docker Desktop
env:
  - name: DB_HOST
    value: "host.docker.internal"  # Special hostname for Docker Desktop to connect to localhost
  - name: DB_PORT
    value: "3306"
  - name: DB_USER
    value: flask_user
  - name: DB_PASSWORD
    value: "flask_password"  # Direct password value for local development
  - name: DB_NAME
    value: flask_app

  - name: CELERY_BROKER_URL
    value: "amqp://rabbituser:rabbitpass@rabbitmq.messaging.svc.cluster.local:5672//"
  - name: CELERY_RESULT_BACKEND
    value: "redis://redis-master.cache.svc.cluster.local:6379/0"

resources: {}