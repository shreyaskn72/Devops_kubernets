replicaCount: 2

image:
  repository: ghcr.io/shreyaskn72/hello-world-flask-kubernets
  tag: master-894cc04
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: flask-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Database Configuration
# For the VS Code devcontainer: Set enabled to false
# MySQL runs as a Docker container outside the kind cluster.
mysql:
  enabled: false
  auth:
    rootPassword: rootpassword
    database: flask_app
    username: flask_user
    password: flask_password
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Environment variables for Flask app
# VS Code devcontainer + kind: reach the Docker-published MySQL port through
# the kind network gateway.
env:
  - name: DB_HOST
    value: "172.18.0.1"
  - name: DB_PORT
    value: "3306"
  - name: DB_USER
    value: flask_user
  - name: DB_PASSWORD
    value: "flask_password"
  - name: DB_NAME
    value: flask_app

  - name: CELERY_BROKER_URL
    value: "amqp://rabbituser:rabbitpass@rabbitmq.messaging.svc.cluster.local:5672//"
  - name: CELERY_RESULT_BACKEND
    value: "redis://redis-master.cache.svc.cluster.local:6379/0"

resources: {}