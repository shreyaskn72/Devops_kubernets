replicaCount: 2

image:
  repository: ghcr.io/shreyaskn72/flask-react-frontend
  tag: master-961d3a1
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: frontend.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

# Leave empty so the browser derives the API's Codespaces forwarded hostname
# from the frontend hostname (...-3000 -> ...-5000).
env:
  REACT_APP_API_URL: "https://potential-space-train-65xg9v6prpwcjrw-5000.app.github.dev/"

