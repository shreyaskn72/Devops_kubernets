apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "celery-beat.fullname" . | default "celery-beat" }}
  labels:
    app: celery-beat

spec:
  replicas: 1   # IMPORTANT: only one beat instance
  selector:
    matchLabels:
      app: celery-beat

  template:
    metadata:
      labels:
        app: celery-beat

    spec:
      containers:
        - name: celery-beat

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          workingDir: /app

          command:
            [
              "celery",
              "-A",
              "celery_app.celery",
              "beat",
              "--loglevel=info",
              "--pidfile=/tmp/celerybeat.pid"
            ]

          env:
            - name: CELERY_BROKER_URL
              {{- toYaml .Values.env.CELERY_BROKER_URL | nindent 14 }}

            - name: CELERY_RESULT_BACKEND
              {{- toYaml .Values.env.CELERY_RESULT_BACKEND | nindent 14 }}

            - name: DB_HOST
              {{- toYaml .Values.env.DB_HOST | nindent 14 }}

            - name: DB_USER
              {{- toYaml .Values.env.DB_USER | nindent 14 }}

            - name: DB_PASSWORD
              {{- toYaml .Values.env.DB_PASSWORD | nindent 14 }}

            - name: DB_NAME
              {{- toYaml .Values.env.DB_NAME | nindent 14 }}

          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}

            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}

          # Simple process health check
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/celerybeat.pid

            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/celerybeat.pid

            initialDelaySeconds: 15
            periodSeconds: 30

      restartPolicy: Always