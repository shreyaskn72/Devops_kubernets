replicaCount: 1

image:
  repository: mher/flower
  tag: 1.0.0
  pullPolicy: IfNotPresent

service:
  type: NodePort
  nodePort: 30555

env:
  BROKER_URL: "amqp://rabbituser:rabbitpass@rabbitmq.messaging.svc.cluster.local:5672//"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

