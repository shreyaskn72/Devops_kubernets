apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flower.fullname" . | default "flower" }}
  labels:
    app: flower
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      containers:
        - name: flower
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          command: ["celery", "-A", "celery_app.celery", "flower", "--port=5555"]
          env:
            - name: CELERY_BROKER_URL
              {{- toYaml .Values.env.CELERY_BROKER_URL | nindent 14 }}
            - name: CELERY_RESULT_BACKEND
              {{- toYaml .Values.env.CELERY_RESULT_BACKEND | nindent 14 }}
            - name: DB_HOST
              {{- toYaml .Values.env.DB_HOST | nindent 14 }}
            - name: DB_USER
              {{- toYaml .Values.env.DB_USER | nindent 14 }}
            - name: DB_PASSWORD
              {{- toYaml .Values.env.DB_PASSWORD | nindent 14 }}
            - name: DB_NAME
              {{- toYaml .Values.env.DB_NAME | nindent 14 }}
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
          livenessProbe:
            httpGet:
              path: /
              port: 5555
            initialDelaySeconds: 30
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: 5555
            initialDelaySeconds: 10
            periodSeconds: 10
      restartPolicy: Always
