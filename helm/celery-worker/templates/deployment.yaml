apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "celery-worker.fullname" . | default "celery-worker" }}
  labels:
    app: celery-worker
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          command:
            [
              "celery",
              "-A",
              "celery_app.celery",
              "worker",
              "--loglevel=info",
              "--pidfile=/tmp/celeryworker.pid"
            ]
          env:
            - name: CELERY_BROKER_URL
              value: {{ .Values.env.CELERY_BROKER_URL | quote }}
            - name: CELERY_RESULT_BACKEND
              value: {{ .Values.env.CELERY_RESULT_BACKEND | quote }}
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_USER
              value: "flask_user"
            - name: DB_PASSWORD
              value: "flask_password"
            - name: DB_NAME
              value: "flask_app"
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/celeryworker.pid

            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/celeryworker.pid

            initialDelaySeconds: 15
            periodSeconds: 30
      restartPolicy: Always
