version: '3.8'

services:
  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  # Redis - Result Backend & Caching
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: flask_app
      MYSQL_USER: flask_user
      MYSQL_PASSWORD: flask_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  # Flask API
  flask-api:
    image: ghcr.io/shreyaskn72/hello-world-flask-kubernets:master-0781209
    container_name: flask-api
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: flask_user
      DB_PASSWORD: flask_password
      DB_NAME: flask_app
      CELERY_BROKER_URL: amqp://rabbituser:rabbitpass@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # React Frontend
  react-frontend:
    image: ghcr.io/shreyaskn72/flask-react-frontend:master-da6b6d0
    container_name: react-frontend
    command: serve -s build -l tcp://0.0.0.0:3000
    ports:
      - "3001:3000"
    environment:
      REACT_APP_API_URL: http://flask-api:5000
    depends_on:
      - flask-api
    networks:
      - app-network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    image: ghcr.io/shreyaskn72/hello-world-flask-kubernets:master-0781209
    container_name: celery-worker
    command: celery -A app.celery worker --loglevel=info --concurrency=1 --max-tasks-per-child=50 --pool=prefork
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: flask_user
      DB_PASSWORD: flask_password
      DB_NAME: flask_app
      CELERY_BROKER_URL: amqp://rabbituser:rabbitpass@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery-beat:
    image: ghcr.io/shreyaskn72/hello-world-flask-kubernets:master-0781209
    container_name: celery-beat
    #entrypoint: /bin/bash
    #working_dir: /app
    command:
      [
        "celery",
        "-A",
        "celery_app.celery",
        "beat",
        "--loglevel=info",
        "--pidfile=/tmp/celerybeat.pid"
      ]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: flask_user
      DB_PASSWORD: flask_password
      DB_NAME: flask_app
      CELERY_BROKER_URL: amqp://rabbituser:rabbitpass@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_BEAT_SCHEDULER: celery.beat:PersistentScheduler
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Flower (Celery Monitoring)
  flower:
    image: ghcr.io/shreyaskn72/hello-world-flask-kubernets:master-0781209
    container_name: flower
    command: celery -A app.celery flower --port=5555 --broker=amqp://rabbituser:rabbitpass@rabbitmq:5672//
    ports:
      - "5555:5555"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: flask_user
      DB_PASSWORD: flask_password
      DB_NAME: flask_app
      CELERY_BROKER_URL: amqp://rabbituser:rabbitpass@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
  mysql-data:
